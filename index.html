:root{
  --navy:#0E2A3B;--navy-2:#1B4460;--steel:#5B7384;--brass:#D9A21B;--brass-2:#C08D10;--brass-soft:#FBF1D6;
  --sea:#1F8A6A;--sea-soft:#DDF2EA;--sky:#2A6FB0;--sky-soft:#E0ECF8;--signal:#D8452B;--signal-soft:#FBE4DF;--amber-t:#8A6508;
  --bg:#F2F5F8;--surface:#FFFFFF;--surface-2:#F5F8FA;--line:#DCE4EA;--line-2:#E8EEF2;--text:#14232E;--muted:#617584;
  --shadow:0 1px 2px rgba(14,42,59,.05),0 6px 20px -10px rgba(14,42,59,.18);--shadow-lg:0 30px 70px -20px rgba(8,22,32,.45);
  --r:14px;--r-sm:9px;--font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#9CC3DC;--navy-2:#6FA6C8;--steel:#8FA6B6;--brass-soft:#3A3118;--sea:#45C29B;--sea-soft:#15362C;--sky:#6DA8E0;--sky-soft:#16304A;--signal:#F07158;--signal-soft:#3D2019;--amber-t:#E7B53B;
  --bg:#0B1822;--surface:#12232F;--surface-2:#0F1E29;--line:#223A4C;--line-2:#1B3141;--text:#E4EDF3;--muted:#9AB0BF;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--navy:#9CC3DC;--navy-2:#6FA6C8;--steel:#8FA6B6;--brass-soft:#3A3118;--sea:#45C29B;--sea-soft:#15362C;--sky:#6DA8E0;--sky-soft:#16304A;--signal:#F07158;--signal-soft:#3D2019;--amber-t:#E7B53B;
  --bg:#0B1822;--surface:#12232F;--surface-2:#0F1E29;--line:#223A4C;--line-2:#1B3141;--text:#E4EDF3;--muted:#9AB0BF;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--sky);text-decoration:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.i.sm{width:16px;height:16px;vertical-align:-3px}
.ltr{direction:ltr;unicode-bidi:isolate}.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.center{text-align:center;justify-content:center}.d-block{display:block}
.txt-red{color:var(--signal)!important}.txt-green{color:var(--sea)!important}.txt-amber{color:var(--amber-t)!important}small.cur{color:var(--muted);font-size:11px}
[hidden]{display:none!important}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;height:64px;padding:0 20px;background:#0E2A3B;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;margin-inline-end:6px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--brass);color:#0E2A3B;display:grid;place-items:center;flex:none}.mark svg{width:24px;height:24px}
.bt b{display:block;font-size:17px;line-height:1.1;letter-spacing:.2px}.bt small{display:block;font-size:10.5px;opacity:.7;letter-spacing:.8px}
.top-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#fff;font-weight:500;white-space:nowrap}.top-btn:hover{background:rgba(255,255,255,.1)}
.top-sep{width:1px;height:26px;background:rgba(255,255,255,.2)}
.top-search{flex:1;max-width:520px;margin-inline-start:auto;position:relative;display:flex}
.top-search input{width:100%;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 14px 0 44px}
.top-search input::placeholder{color:rgba(255,255,255,.6)}.top-search button{position:absolute;left:4px;top:4px;width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:#fff;display:grid;place-items:center}
.top-icon{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;color:#fff}.top-icon:hover{background:rgba(255,255,255,.1)}
.top-icon b{position:absolute;top:4px;left:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brass);color:#0E2A3B;font-size:11px;display:grid;place-items:center;font-weight:700}
.user-chip{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#fff;padding:4px 8px;border-radius:10px}.user-chip:hover{background:rgba(255,255,255,.1)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brass);color:#0E2A3B;display:grid;place-items:center;font-weight:700;flex:none}.av.sm{width:32px;height:32px;font-size:13px;background:var(--brass-soft);color:var(--amber-t)}
.un{text-align:start;line-height:1.25}.un b{display:block;font-size:13px}.un small{font-size:11px;opacity:.7}
/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;bottom:0;right:0;width:300px;max-width:86vw;background:#0E2A3B;color:#fff;z-index:300;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-open .drawer{transform:none}
.drawer-back{position:fixed;inset:0;background:rgba(5,15,22,.45);z-index:290;opacity:0;pointer-events:none;transition:opacity .2s}.drawer-open .drawer-back{opacity:1;pointer-events:auto}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1)}.drawer-h .icon-btn{color:#fff}
.drawer nav{flex:1;overflow:auto;padding:10px}
.drawer nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.88);font-weight:500;margin-bottom:2px}
.drawer nav a:hover{background:rgba(255,255,255,.08)}.drawer nav a.on{background:var(--brass);color:#0E2A3B}.drawer nav a svg{opacity:.9}
.drawer-f{padding:14px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}.drawer-f small{opacity:.6;font-size:11px}
.side-tab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:90;width:40px;padding:14px 4px;border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;box-shadow:var(--shadow)}
.side-tab span{writing-mode:vertical-rl}.side-tab:hover{color:var(--navy)}
/* ---------- page ---------- */
.page{max-width:1480px;margin:0 auto;padding:22px 28px 60px}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;padding:80px;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px}.crumbs a{color:var(--muted)}.crumbs a:hover{color:var(--navy)}.crumbs span{margin:0 4px}.crumbs b{color:var(--brass-2);font-weight:600}
.ph-title{display:flex;gap:14px;align-items:center}.ph-title h1{margin:0;font-size:28px;line-height:1.25;color:var(--navy);letter-spacing:-.2px}.ph-title p{margin:3px 0 0;color:var(--muted)}
.ph-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--brass-soft);color:var(--brass-2)}.ph-ic svg{width:28px;height:28px}
.ph-side{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;color:var(--muted)}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;white-space:nowrap;transition:filter .12s,background .12s}
.btn:hover{background:var(--surface-2)}.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#0E2A3B}.btn.primary:hover{filter:brightness(1.05)}
.btn.navy{background:#0E2A3B;border-color:#0E2A3B;color:#fff}.btn.navy:hover{filter:brightness(1.2)}
.btn.ghost{background:var(--surface)}.btn.danger{background:var(--signal);border-color:var(--signal);color:#fff}.btn.danger.ghost{background:var(--surface);color:var(--signal);border-color:var(--signal-soft)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}.btn.lg{height:48px;font-size:15px}.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.icon-btn{width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:inline-grid;place-items:center}.icon-btn:hover{background:var(--surface-2);color:var(--text)}.icon-btn.danger:hover{color:var(--signal);background:var(--signal-soft)}
.link{border:0;background:none;padding:0;color:var(--sky);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.link:hover{text-decoration:underline}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);color:inherit;transition:transform .15s}
a.kpi:hover{transform:translateY(-2px)}
.kpi-ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}.kpi-ic svg{width:26px;height:26px}
.kpi-ic.navy{background:#0E2A3B}.kpi-ic.brass{background:var(--brass);color:#0E2A3B}.kpi-ic.green{background:var(--sea)}.kpi-ic.red{background:var(--signal)}.kpi-ic.blue{background:var(--sky)}
.kpi-b{display:flex;flex-direction:column;min-width:0}.kpi-l{font-size:13px;color:var(--muted);font-weight:500}.kpi-v{font-size:28px;line-height:1.2;color:var(--navy);font-variant-numeric:tabular-nums}.kpi-s{font-size:12px;color:var(--muted)}
.kpi-t{font-size:11.5px;display:inline-flex;gap:4px;align-items:center;margin-top:2px}.kpi-t svg{width:14px;height:14px}.kpi-t.up{color:var(--sea)}.kpi-t.down{color:var(--signal)}
/* ---------- panels & grids ---------- */
.grid{display:grid;gap:16px;margin-bottom:16px;align-items:start}.g-2{grid-template-columns:1fr 1fr}.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-3-1{grid-template-columns:minmax(0,3fr) minmax(280px,1fr)}.g-1-3{grid-template-columns:minmax(260px,1fr) minmax(0,3fr)}
.grid>div>.panel+.panel,.grid>aside>*+*{margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel+.panel{margin-top:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}.panel-h:empty,.no-h .panel-h{display:none}
.panel-h h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--navy)}.panel-h h3 svg{color:var(--brass-2)}
.panel-b{padding:16px 18px}
.sec-t{font-size:15px;color:var(--brass-2);margin:20px 0 12px;display:flex;align-items:center;gap:8px}.sec-t::before{content:"";width:3px;height:16px;background:var(--brass);border-radius:2px}
.st-t{font-size:14px;color:var(--navy);display:flex;align-items:center;gap:8px;margin:20px 0 12px;justify-content:space-between}.st-t:first-child{margin-top:0}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty>svg{width:44px;height:44px;opacity:.45;margin-bottom:6px}.empty b{display:block;color:var(--text);font-size:15px}.empty p{margin:4px 0 12px}
/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.green{background:var(--sea-soft);color:var(--sea);border-color:transparent}.badge.amber{background:var(--brass-soft);color:var(--amber-t);border-color:transparent}.badge.red{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.badge.blue{background:var(--sky-soft);color:var(--sky);border-color:transparent}.badge.navy{background:#0E2A3B;color:#fff;border-color:transparent}.badge.brass{background:var(--brass);color:#0E2A3B;border-color:transparent}
/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.f-search{position:relative;flex:1 1 240px}.f-search svg{position:absolute;right:11px;top:10px;color:var(--muted)}
.f-search input,.f-field select,.f-field input{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 12px;width:100%}.f-search input{padding-right:38px}
.f-field{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:0 1 160px}.f-field span{font-size:11.5px;color:var(--muted);font-weight:600}
.f-actions{display:flex;gap:6px;margin-inline-start:auto}
/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--surface-2);text-align:start;font-weight:600;color:var(--steel);font-size:12px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}.tbl tbody tr:hover td{background:var(--surface-2)}.tbl tr.click{cursor:pointer}.tbl tr.sel td{background:var(--brass-soft)!important}
.tbl tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line)}
.tbl .c-act{width:1%;white-space:nowrap;text-align:center}.tbl .c-n{width:1%;white-space:nowrap}
.tbl.items input,.tbl.items select{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:var(--surface);min-width:60px}
.tbl.items input.warn{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
.tbl.matrix td,.tbl.matrix th{text-align:center}.tbl.matrix td:first-child,.tbl.matrix th:first-child{text-align:start}
.tick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#0E2A3B;color:#fff}.tick svg{width:15px;height:15px}
.big-chk{width:20px;height:20px;accent-color:#0E2A3B}
.cell-ic{display:flex;align-items:center;gap:10px}.cell-ic>svg{color:var(--steel)}.cell-ic small{display:block;color:var(--muted);font-size:11.5px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line-2);font-size:12.5px}
.pg{display:flex;gap:4px;align-items:center}.pg button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12.5px}.pg button.cur{background:#0E2A3B;color:#fff;border-color:#0E2A3B}.pg button:disabled{opacity:.4;cursor:default}
.pg-size select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-inline-start:6px}
.route-c{display:inline-flex;gap:6px;align-items:center}.route-c svg{width:16px;height:16px;color:var(--steel)}
/* ---------- forms ---------- */

.review section{border:1px solid var(--line-2);border-radius:12px;padding:14px 16px}.review h4{margin:0 0 8px;color:var(--navy);font-size:14px}
.cal{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin:0 16px}
.cal-leg{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;font-size:12.5px;color:var(--muted)}
.cal-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.cal-leg i.blue{background:var(--sky)}.cal-leg i.green{background:var(--sea)}.cal-leg i.red{background:var(--signal)}.cal-leg i.amber{background:var(--brass)}

/* keep grid children from stretching past the viewport */
.grid>*,.form-page>*,.panel-b>*{min-width:0}
.filters .f-field{min-width:0}.filters select,.filters input{max-width:100%}
@media (max-width:900px){.g-2{grid-template-columns:minmax(0,1fr)}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.filters .f-search,.filters .f-actions{grid-column:1/-1}.filters .f-field select,.filters .f-field input{width:100%}

/* ---------- operations additions ---------- */
.sec-h{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--navy);margin:6px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.sec-h svg{width:18px;height:18px;color:var(--brass-2)}
.sec-h:not(:first-child){margin-top:22px}
.c-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.banner{display:flex;gap:12px;align-items:center;background:var(--brass-soft);border:1px solid rgba(217,162,27,.35);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.banner svg{width:22px;height:22px;color:var(--brass-2);flex:none}
.banner b{display:block;color:var(--text)}.banner small{color:var(--muted)}
.in-sm{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--text);width:100%;font:inherit}
.note-f{display:flex;flex-direction:column;gap:10px}
.note-f input,.note-f textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--text);font:inherit;width:100%}
.note-f input:focus,.note-f textarea:focus,.task-f input:focus,.task-f select:focus,.in-sm:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(27,68,96,.12)}
.note-opts{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.note-opts .btn{margin-inline-start:auto}
.task-f{display:grid;grid-template-columns:1fr 150px 170px auto;gap:8px;margin-bottom:12px}
.task-f input,.task-f select{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface);color:var(--text);font:inherit;min-width:0}
.upc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.upc a{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:10px;color:inherit;text-decoration:none}
.upc a:hover{background:var(--surface-2)}
.upc small{display:block;color:var(--muted);font-size:11.5px}
.upc time{font-size:11.5px;color:var(--steel);text-align:left}
.cal-leg{display:flex;align-items:center;gap:6px;margin-inline-start:auto;font-size:12px;color:var(--muted);flex-wrap:wrap}
.cal-leg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-start:6px}
.cal-leg i.blue{background:var(--sky)}.cal-leg i.green{background:var(--sea)}.cal-leg i.amber{background:var(--brass)}.cal-leg i.red{background:var(--signal)}
.cal-nav{padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cal-c .more{font-size:10.5px;color:var(--steel);padding-inline-start:4px}

.wiz li>div{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.35}
.wiz-panel .wiz{border-bottom:0}
@media (max-width:560px){.mods{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}.mod{padding:16px 10px}.mod small{display:none}}
.top-search[hidden]{display:none}

/* ---------- security ---------- */
.banner.red{background:var(--signal-soft);border-color:rgba(216,69,43,.35)}.banner.red svg{color:var(--signal)}
.sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sess li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px}
.sess b{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sess small{display:block;color:var(--muted);font-size:12px}
.mfa-setup{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.mfa-setup img{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;width:200px;height:200px}
.mfa-setup ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;line-height:1.7}
.mfa-setup code{display:block;margin-top:6px;font-size:15px;letter-spacing:2px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;width:max-content;max-width:100%;overflow-wrap:anywhere}
.mfa-confirm{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.mfa-confirm input{height:44px;width:170px;font-size:22px;letter-spacing:6px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.otp-in{font-size:22px !important;letter-spacing:6px;text-align:center}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.codes code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;font-size:16px;letter-spacing:2px}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0 22px}
.policy{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.policy li{display:flex;gap:8px;align-items:flex-start;line-height:1.6}.policy svg{width:18px;height:18px;color:var(--sea);flex:none;margin-top:3px}
@media (max-width:760px){.mfa-setup{grid-template-columns:1fr}.mfa-setup img{margin:auto}.sess li{grid-template-columns:36px 1fr}.sess li .btn{grid-column:1/-1}}
.mfa-confirm .field{flex:0 0 auto;width:auto;margin:0;min-width:0}
.mfa-confirm .btn{flex:0 0 auto;height:44px}

async function api(method, path, body, raw) {
  for (let i = 0; i < 5; i++) {
    let res = null;
    try {
      res = await fetch(path.startsWith('api/') ? path : 'api/erp' + path, raw ? { method, credentials: 'same-origin', body: raw.body, headers: raw.headers } : {
        method, credentials: 'same-origin', cache: 'no-store', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    } catch (e) { res = null; }
    if (res && ![502, 503, 504].includes(res.status)) {
      let d = null; try { d = await res.json(); } catch (e) {}
      if (res.status === 401 && !path.startsWith('api/auth')) { toast('انتهت الجلسة، سجّل الدخول من جديد', 'err'); setTimeout(() => location.reload(), 1200); throw new Error('انتهت الجلسة'); }
      if (!d) throw new Error('ردّ غير متوقع من الخادم.');
      if (!res.ok || d.ok === false) { const e = new Error(d.error || 'تعذّر تنفيذ العملية.'); e.field = d.field; throw e; }
      return d;
    }
    await sleep(1000 + i * 700);
  }
  throw new Error('تعذّر الاتصال بالخادم. حاول بعد لحظات.');
}

/* ---------------- notifications ---------------- */
function computeNotifs() {
  const out = [], t = todayISO();
  const push = (key, cat, icon, title, text, at, href, tone = 'navy') => out.push({ key, cat, icon, title, text, at, href, tone });
  if (APP.data.events && can('ops')) APP.data.events.slice(-60).forEach((e) => {
    const j = byId('jobs', e.jobId); if (!j) return;
    if (e.type === 'status') push('ev' + e.id, 'ops', 'truck', `تم تحديث حالة الشحنة ${j.no}`, e.text, e.at, `#/ops/${j.id}`);
    else if (e.type === 'create') push('ev' + e.id, 'ops', 'box', `شحنة جديدة ${j.no}`, `${refLabel('parties', j.customerId)} · ${e.by}`, e.at, `#/ops/${j.id}`);
  });
  if (can('contracts')) list('contracts').filter((c) => c.status === 'expiring').forEach((c) => push('ct' + c.id + c.end, 'contracts', 'contract', `اقتراب موعد انتهاء العقد ${c.no}`, `ينتهي خلال ${daysLeft(c.end)} يوم في ${c.end}`, c.end + 'T08:00', '#/contracts', 'brass'));
  if (can('finance')) list('invoices').filter((i) => i.status === 'overdue').forEach((i) => push('inv' + i.id, 'finance', 'calc', `فاتورة متأخرة ${i.no}`, `${refLabel('parties', i.partyId)} · الرصيد ${nf(i.balance, 2)} ${i.currency}`, i.dueDate + 'T08:00', `#/finance/invoice/${i.id}`, 'red'));
  if (can('fleet')) {
    list('maintenance').filter((m) => m.state !== 'done' && m.due && daysLeft(m.due) <= 7).forEach((m) => push('mt' + m.id, 'system', 'wrench', `تذكير: مركبة تحتاج إلى صيانة`, `${refLabel('trucks', m.truckId)} · ${optLabel('maintenance', 'type', m.type)} ${daysLeft(m.due) < 0 ? 'متأخرة' : `خلال ${daysLeft(m.due)} يوم`}`, m.due + 'T07:00', '#/fleet?tab=maintenance', 'brass'));
    list('trucks').forEach((x) => [['licenseExpiry', 'الترخيص'], ['insuranceExpiry', 'التأمين'], ['inspectionExpiry', 'الفحص الفني']].forEach(([k, l]) => { if (x[k] && daysLeft(x[k]) <= 30) push(`tr${x.id}${k}${x[k]}`, 'system', 'truck', `${l} للمركبة ${x.plate} ${daysLeft(x[k]) < 0 ? 'منتهٍ' : 'ينتهي قريباً'}`, `تاريخ الانتهاء ${x[k]}`, x[k] + 'T06:00', '#/fleet', 'red'); }));
  }
  if (can('documents')) list('documents').filter((d) => d.expiryDate && daysLeft(d.expiryDate) <= 30).forEach((d) => push('dc' + d.id + d.expiryDate, 'system', 'doc', `مستند ${daysLeft(d.expiryDate) < 0 ? 'منتهي الصلاحية' : 'تقترب صلاحيته من الانتهاء'}`, `${d.name} · ${d.expiryDate}`, d.expiryDate + 'T06:00', '#/documents', 'brass'));
  list('tasks').filter((x) => !x.done && x.due && x.due < t && x.assignee === APP.me.id).forEach((x) => push('tk' + x.id, 'ops', 'clip', `مهمة متأخرة: ${x.title}`, `كان موعدها ${x.due}`, x.due + 'T09:00', x.jobId ? `#/ops/${x.jobId}?tab=notes` : '#/ops', 'red'));
  if (can('crm')) list('quotes').filter((q) => q.status === 'requested').forEach((q) => push('qr' + q.id, 'ops', 'send', `طلب عرض سعر جديد ${q.no}`, `${refLabel('parties', q.partyId)} · ${q.origin} ← ${q.destination}`, q.createdAt, `#/quotes/${q.id}`, 'brass'));
  const read = new Set(APP.prefs.readKeys || []); const readAll = APP.prefs.readAll || '';
  out.forEach((n) => { n.read = read.has(n.key) || (readAll && n.at && n.at <= readAll); });
  return out.sort((a, b) => String(b.at).localeCompare(String(a.at)));
}
async function markRead(keys, all) {
  const p = APP.prefs;
  if (all) p.readAll = new Date().toISOString().slice(0, 16);

}

}

/* ---------------- router ---------------- */
const ROUTES = [];
function route(pattern, fn, mod) { const keys = []; const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$'); ROUTES.push({ re, keys, fn, mod, pattern }); }
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const [p, q] = h.split('?'); const query = Object.fromEntries(new URLSearchParams(q || ''));
  return { path: p || '/', query };
}
async function render() {
  closeMenus(); $$('.modal-back').forEach((m) => m.remove());
  const { path, query } = parseHash();
  const main = $('#page');
  if (!main || !APP.me) return; // signed out: the login screen is showing
  main.onclick = main.onchange = main.oninput = main.onsubmit = null;
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (!m) continue;
    const params = Object.fromEntries(r.keys.map((k, i) => [k, m[i + 1]]));
    if (APP.me.role === 'client' && !r.pattern.startsWith('/portal') && !['/profile', '/notifications'].includes(r.pattern)) { location.hash = '#/portal'; return; }
    if (APP.me.must2fa && r.pattern !== '/profile') { location.hash = '#/profile?tab=security'; return; }
    if (r.mod && !can(r.mod) && !(r.mod === 'customs' && can('customs'))) { main.innerHTML = pageHead({ title: 'لا توجد صلاحية', updated: false }) + emptyState('lock', 'ليست لديك صلاحية للوصول إلى هذه الوحدة', `دورك الحالي: ${APP.me.roleLabel}. تواصل مع مدير النظام.`, '<a class="btn primary" href="#/">العودة للرئيسية</a>'); return; }
    APP.route = r.pattern;
    $$('.drawer a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + (r.pattern.split('/').slice(0, 2).join('/') || '/')));
    main.innerHTML = `<div class="loading"><span class="spin"></span> جارٍ التحميل…</div>`;
    window.scrollTo(0, 0);
    try { await r.fn(main, params, query); }
    catch (e) { console.error(e); main.innerHTML = pageHead({ title: 'حدث خطأ', updated: false }) + emptyState('alert', 'تعذّر تحميل الصفحة', e.message, `<button class="btn primary" onclick="render()">${ic('refresh')} إعادة المحاولة</button>`); }
    updateBell();
    return;
  }
  main.innerHTML = pageHead({ title: 'الصفحة غير موجودة', updated: false }) + emptyState('search', 'لم يتم العثور على الصفحة', '', '<a class="btn primary" href="#/">العودة للرئيسية</a>');
}
const go = (h) => { if (location.hash === h) render(); else location.hash = h; };

};
const CTYPES = ['20GP', '40GP', '40HC', '45HC', '20RF', '40RH', '20OT', '40OT', '20FR', '40FR', 'Tank'];
function validContainer(no) {
  const s = String(no).toUpperCase(); if (!/^[A-Z]{4}\d{7}$/.test(s)) return false;
  const val = (ch) => { if (/\d/.test(ch)) return +ch; const n = ch.charCodeAt(0) - 55; return n + Math.floor((n - 1) / 10); };
  let sum = 0; for (let i = 0; i < 10; i++) sum += val(s[i]) * Math.pow(2, i);
  return (sum % 11) % 10 === +s[10];
}
const routeTxt = (j) => `${esc(j.origin || '—')}${j.originCountry ? '، ' + esc(j.originCountry) : ''} ← ${esc(j.destination || '—')}${j.destCountry ? '، ' + esc(j.destCountry) : ''}`;

function containersEditor(root, items) {
  const st = { items: (items || []).map((c) => ({ ...c })) };
  const draw = () => {
    root.innerHTML = `${st.items.map((c, i) => `<div class="c-row" data-i="${i}"><input data-k="no" class="ltr num ${c.no && c.no.length === 11 && !validContainer(c.no) ? 'warn' : ''}" value="${esc(c.no || '')}" placeholder="MSCU1234567" aria-label="رقم الحاوية">
      <select data-k="type" aria-label="نوع الحاوية">${CTYPES.map((t) => `<option ${t === c.type ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <input data-k="seal" class="ltr" value="${esc(c.seal || '')}" placeholder="رقم الختم" aria-label="الختم"><input data-k="kg" type="number" step="any" class="ltr num" value="${esc(c.kg ?? '')}" placeholder="الوزن كغ" aria-label="الوزن">
      <button type="button" class="icon-btn danger" data-cdel aria-label="حذف الحاوية">${ic('trash')}</button></div>`).join('')}
      <div class="c-foot"><button type="button" class="btn sm ghost" data-cadd>${ic('plus')} إضافة حاوية</button><small class="hint">يتم التحقق من رقم الحاوية وفق معيار ISO 6346.</small></div>`;
  };
  const upd = (e) => { const r = e.target.closest('[data-i]'); if (!r || !e.target.dataset.k) return; const c = st.items[+r.dataset.i]; let v = e.target.value;
    if (e.target.dataset.k === 'no') { v = v.toUpperCase().replace(/\s/g, ''); e.target.value = v; e.target.classList.toggle('warn', v.length === 11 && !validContainer(v)); } c[e.target.dataset.k] = v; };
  root.addEventListener('input', upd); root.addEventListener('change', upd);
  root.addEventListener('click', (e) => { if (e.target.closest('[data-cadd]')) { st.items.push({ type: '40HC' }); draw(); $$('[data-k="no"]', root).pop().focus(); }
    const d = e.target.closest('[data-cdel]'); if (d) { st.items.splice(+d.closest('[data-i]').dataset.i, 1); draw(); } });
  draw();
  return { get items() { return st.items.filter((c) => c.no || c.kg); } };
}

function statusDialog(j, done) {
  const flow = [...SC.JOB_FLOW[family(j.mode)], 'cancelled'];
  const m = modal({ title: `تحديث حالة ${j.no}`, icon: 'refresh', body: `<form class="form-grid cols-1"><div class="field"><label for="sdSt">الحالة الجديدة</label><select id="sdSt" name="status">${flow.map((s) => `<option value="${s}" ${s === j.status ? 'selected' : ''}>${esc(SC.JOB_STATUS[s][0])}</option>`).join('')}</select></div>
    <div class="field"><label for="sdNote">ملاحظة (اختياري)</label><input id="sdNote" name="note" placeholder="مثال: غادرت السفينة ميناء جبل علي"></div></form>`,
    foot: `<button class="btn primary ok">${ic('check')} تحديث الحالة</button><button class="btn ghost no">إلغاء</button>` });
  $('.no', m.el).onclick = m.close;
  $('form', m.el).onsubmit = (e) => { e.preventDefault(); $('.ok', m.el).click(); };
  $('.ok', m.el).onclick = (e) => busy(e.currentTarget, async () => {
    const d = readForm($('form', m.el));
    if (d.status === j.status) { m.close(); return; }
    if (d.status === 'cancelled' && !(await confirmBox('تأكيد إلغاء الشحنة؟'))) return;
    const r = await api('POST', `/jobs/${j.id}/status`, d);
    const arr = APP.data.jobs || []; const i = arr.findIndex((x) => x.id === j.id); if (i >= 0) arr[i] = r.job;
    if (APP.data.events) await load(['events'], true);
    m.close(); toast('تم تحديث الحالة'); done && done(r.job);
  }).catch(() => {});
}

function printBL(j, truck, driver) {

  printDoc(`${kind} ${j.no}`, docHeader(kind, fam === 'sea' ? (j.hbl || j.mbl || j.no) : fam === 'land' ? (j.cmr || j.no) : (j.declNo || j.no), todayISO()) + `
    <div class="grid">${box('الشاحن Shipper', j.shipper || c.nameAr)}${box('المستلم Consignee', j.consignee || refLabel('parties', j.customerId))}${box('العميل', refLabel('parties', j.customerId))}${box('الإنكوترم', j.incoterm)}
    ${fam === 'sea' ? box('السفينة / الرحلة', [j.vessel, j.voyage].filter(Boolean).join(' / ')) + box('رقم الحجز', j.bookingNo) + box('ميناء الشحن', j.origin) + box('ميناء التفريغ', j.destination) + box('MBL', j.mbl) + box('HBL', j.hbl)
      : fam === 'land' ? box('مكان الاستلام', j.origin) + box('مكان التسليم', j.destination) + box('الشاحنة', truck ? truck.plate : '') + box('المقطورة', j.trailer) + box('السائق', driver ? driver.name : '') + box('المنفذ الحدودي', j.border)
      : box('رقم البيان', j.declNo) + box('المنفذ', j.customsOffice) + box('المستورد', j.importer) + box('المصدّر', j.exporter)}

  const events = () => {
    const out = [];

    });

    return out;
  };
  const draw = () => {
    $('#calT').textContent = `${AR_MONTHS[st.m - 1]} ${st.y}`;
    const first = new Date(st.y, st.m - 1, 1), start = new Date(first); start.setDate(1 - ((first.getDay() + 1) % 7));
    const evs = events(), tISO = todayISO();
    let html = `<div class="cal-h">${['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'].map((x) => `<b>${x}</b>`).join('')}</div><div class="cal-g">`;
    for (let i = 0; i < 42; i++) {
      const dd = new Date(start); dd.setDate(start.getDate() + i);
      const iso = `${dd.getFullYear()}-${String(dd.getMonth() + 1).padStart(2, '0')}-${String(dd.getDate()).padStart(2, '0')}`;
      const de = evs.filter((e) => e.d === iso);
      html += `<div class="cal-c ${dd.getMonth() !== st.m - 1 ? 'out' : ''} ${iso === tISO ? 'today' : ''}"><span class="cal-d">${dd.getDate()}</span>${de.slice(0, 3).map((e) => `<a class="cal-e ${e.tone}" ${e.href ? `href="${e.href}"` : `href="#" data-trip="${e.trip}"`} title="${esc(e.t + ' · ' + e.s)}">${ic(e.icon)}<span><b class="ltr">${esc(e.t)}</b><small>${esc(e.lbl)}${e.time ? ' ' + e.time : ''}</small></span></a>`).join('')}${de.length > 3 ? `<small class="more">+${de.length - 3} أخرى</small>` : ''}</div>`;
    }
    $('#cal').innerHTML = html + '</div>';
    const up = evs.filter((e) => e.d >= tISO).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 8);
    $('#calSide').innerHTML = panel('المواعيد القادمة', up.length ? `<ul class="upc">${up.map((e) => `<li><a ${e.href ? `href="${e.href}"` : `href="#" data-trip="${e.trip}"`}><span class="s-ic ${e.tone}">${ic(e.icon)}</span><div><b class="ltr">${esc(e.t)}</b><small>${esc(e.s)}</small><small>${esc(e.lbl)}</small></div><time class="ltr">${esc(e.d)}${e.time ? '<br>' + e.time : ''}</time></a></li>`).join('')}</ul>` : '<p class="muted">لا توجد مواعيد قادمة.</p>', { icon: 'clock' });
  };
  main.onclick = (e) => {
    const n = e.target.closest('[data-nav]'); if (n) { const k = +n.dataset.nav; if (k === 0) { st.y = now.getFullYear(); st.m = now.getMonth() + 1; } else { st.m += k; if (st.m > 12) { st.m = 1; st.y++; } if (st.m < 1) { st.m = 12; st.y--; } } draw(); return; }
    if (e.target.closest('#addTrip')) return tripForm(null, {}, () => { toast('تمت جدولة الرحلة'); draw(); });
    const tr = e.target.closest('[data-trip]'); if (tr) { e.preventDefault(); if (can('fleet', 'u')) tripForm(byId('trips', +tr.dataset.trip), {}, draw); }
  };
  bindFilters(main, st, draw);
  draw();
}, 'ops');

  if (j.status === 'cancelled') return ['ملغى', 'red'];
  if (['released', 'delivered', 'closed', 'duty_paid'].includes(j.status)) return ['مكتملة', 'green'];
  if (j.status === 'inspection' || j.channel === 'red') return ['قيد التدقيق', 'blue'];
  if (!j.declNo || j.status === 'awaiting_docs') return ['بانتظار المستندات', 'amber'];

};

async function branchForm(main, id) {
  await load(['branches']);
  const it = id ? byId('branches', id) : null; if (id && !it) throw new Error('الفرع غير موجود');
  const v = it || { kind: 'branch', status: 'active', currency: 'USD', timezone: 'Asia/Damascus' };
  const steps = [{ t: 'البيانات الأساسية' }, { t: 'معلومات الاتصال' }, { t: 'المراجعة والحفظ' }];
  let cur = 0;
  main.innerHTML = `${pageHead({ title: it ? `تعديل ${it.name}` : 'إضافة فرع أو وكيل', icon: 'network', crumbs: [['الفروع والوكلاء', '#/branches'], [it ? 'تعديل' : 'إضافة']], updated: false, actions: `<a class="btn ghost" href="#/branches">${ic('arrowR')} العودة</a>` })}
    <div class="grid g-3-1"><div class="panel wiz-panel"><div id="wh"></div><form id="bf" novalidate></form>
      <div class="form-actions"><button class="btn primary" id="bNext"></button><button class="btn ghost" id="bBack">السابق</button><button class="btn ghost" id="bDraft">${ic('save')} حفظ</button><a class="btn ghost" href="#/branches">إلغاء</a></div></div>
      <aside id="bSide"></aside></div>`;
  const cap = () => Object.assign(v, readForm($('#bf')));
  const side = () => { $('#bSide').innerHTML = panel('معاينة الفرع', `<dl class="kv-list">${['kind', 'name', 'country', 'city', 'address', 'manager', 'phone', 'email', 'timezone', 'currency'].map((k) => `<div><dt>${F('branches', k).label}</dt><dd>${esc(F('branches', k).t === 'enum' ? optLabel('branches', k, v[k]) : v[k] || '—')}</dd></div>`).join('')}</dl>`, { icon: 'pin' }); };
  const draw = () => {
    $('#wh').innerHTML = wizardHead(steps, cur);
    $('#bf').innerHTML = cur === 0 ? `<div class="form-grid cols-2">${fields('branches', ['kind', 'name', 'country', 'city', ['address', { full: true }], 'status', 'commitment'], v)}</div>`
      : cur === 1 ? `<div class="form-grid cols-2">${fields('branches', ['manager', 'phone', 'email', 'timezone', 'currency'], v)}</div>`
        : `<dl class="kv-list cols-2">${Object.keys(SC.E.branches.fields).map((k) => `<div><dt>${F('branches', k).label}</dt><dd>${esc(F('branches', k).t === 'enum' ? optLabel('branches', k, v[k]) : v[k] ?? '—')}</dd></div>`).join('')}</dl>`;
    $('#bNext').innerHTML = cur === 2 ? `${ic('save')} حفظ الفرع` : `التالي ${ic('chevL')}`; $('#bBack').hidden = !cur; side();
  };
  const save = (btn) => busy(btn, async () => { cap(); if (!v.name) { cur = 0; draw(); fieldError($('#bf'), 'name', 'الاسم مطلوب'); throw new Error('الاسم مطلوب'); } await saveEnt('branches', v, it && it.id); toast('تم حفظ الفرع'); go('#/branches'); }).catch(() => {});
  $('#bf').oninput = () => { cap(); side(); }; $('#bf').onchange = () => { cap(); side(); };
  $('#bNext').onclick = (e) => { e.preventDefault(); cap(); if (cur === 0 && !v.name) return fieldError($('#bf'), 'name', 'الاسم مطلوب'); if (cur < 2) { cur++; draw(); } else save(e.currentTarget); };
  $('#bBack').onclick = (e) => { e.preventDefault(); cap(); cur--; draw(); };
  $('#bDraft').onclick = (e) => { e.preventDefault(); save(e.currentTarget); };
  draw();
}

async function truckForm(main, id) {
  await load(['trucks', 'drivers', 'branches']);

    <div class="grid g-3-1"><div class="panel wiz-panel"><div id="wh"></div><form id="tf" novalidate></form>
      <div class="form-actions"><button class="btn primary" id="tNext"></button><button class="btn ghost" id="tBack">السابق</button><button class="btn ghost" id="tSave">${ic('save')} حفظ</button><a class="btn ghost" href="#/fleet">إلغاء</a></div></div>
      <aside>${panel('معاينة المركبة', `<div class="truck-ill">${ic('truck')}</div><div id="tPrev"></div>`, { icon: 'eye' })}</aside></div>`;
  const cap = () => Object.assign(v, readForm($('#tf')));
  const prev = () => { $('#tPrev').innerHTML = `<dl class="kv-list">${[['رقم اللوحة', v.plate], ['النوع', optLabel('trucks', 'type', v.type)], ['الصانع / الطراز', [v.make, v.model, v.year].filter(Boolean).join(' ')], ['الحمولة', v.capacityKg ? nf(v.capacityKg) + ' كغ' : ''], ['الحالة', optLabel('trucks', 'status', v.status)]].map(([k, x]) => `<div><dt>${k}</dt><dd>${esc(x || '—')}</dd></div>`).join('')}</dl>`; };
  const draw = () => {
    $('#wh').innerHTML = wizardHead(steps, cur);
    $('#tf').innerHTML = cur === 0 ? `<div class="form-grid cols-3">${fields('trucks', ['plate', 'type', 'make', 'model', 'year', 'vin', 'capacityKg', 'branchId', 'fuel', 'odometer', 'driverId', 'status', 'location', 'trailer'], v)}</div>`
      : cur === 1 ? `<div class="form-grid cols-3">${fields('trucks', ['licenseExpiry', 'insuranceExpiry', 'inspectionExpiry', ['notes', { full: true }]], v)}</div><p class="muted">يُنبّهك النظام قبل 30 يوماً من انتهاء أي وثيقة.</p>`
        : `<dl class="kv-list cols-2">${['plate', 'type', 'make', 'model', 'year', 'vin', 'capacityKg', 'fuel', 'odometer', 'branchId', 'driverId', 'status', 'licenseExpiry', 'insuranceExpiry', 'inspectionExpiry'].map((k) => { const f = F('trucks', k); const x = f.t === 'enum' ? optLabel('trucks', k, v[k]) : f.t === 'ref' ? refLabel(f.ref, +v[k]) : v[k]; return `<div><dt>${f.label}</dt><dd>${esc(x || '—')}</dd></div>`; }).join('')}</dl>`;
    $('#tNext').innerHTML = cur === 2 ? `${ic('save')} حفظ المركبة` : `التالي ${ic('chevL')}`; $('#tBack').hidden = !cur; prev();
  };
  const save = (btn) => busy(btn, async () => { cap(); if (!v.plate) { cur = 0; draw(); fieldError($('#tf'), 'plate', 'رقم اللوحة مطلوب'); throw new Error('رقم اللوحة مطلوب'); } await saveEnt('trucks', v, it && it.id); toast('تم حفظ المركبة'); go('#/fleet'); }).catch(() => {});
  $('#tf').oninput = () => { cap(); prev(); }; $('#tf').onchange = () => { cap(); prev(); };
  $('#tNext').onclick = (e) => { e.preventDefault(); cap(); if (cur === 0 && !v.plate) return fieldError($('#tf'), 'plate', 'رقم اللوحة مطلوب'); if (cur < 2) { cur++; draw(); } else save(e.currentTarget); };

  draw();
}

async function employeeForm(main, id) {

    <div class="grid g-3-1"><div class="panel wiz-panel"><div id="wh"></div><form id="ef" novalidate></form>
      <div class="form-actions"><button class="btn primary" id="eNext"></button><button class="btn ghost" id="eBack">السابق</button><button class="btn ghost" id="eSave">${ic('save')} حفظ</button><a class="btn ghost" href="#/hr">إلغاء</a></div></div>
      <aside>${panel('ملف الموظف', '<div id="ePrev"></div>', { icon: 'user' })}</aside></div>`;

  const prev = () => { $('#ePrev').innerHTML = `<div class="emp-av">${esc((v.name || '؟').charAt(0))}</div><b class="center">${esc(v.name || 'اسم الموظف')}</b><p class="center muted">${esc(v.title || '')}</p>${eBadge('employees', 'status', v.status)}<small class="muted d-block center">${it ? esc(it.empNo) : 'سيتم إنشاء الرقم الوظيفي تلقائياً بعد الحفظ'}</small>`; };
  const draw = () => {
    $('#wh').innerHTML = wizardHead(steps, cur);
    $('#ef').innerHTML = [`<div class="form-grid cols-3">${fields('employees', ['name', 'nationalId', 'birthDate', 'phone', 'email'], v)}</div>`,
      `<div class="form-grid cols-3">${fields('employees', ['branchId', 'department', 'title', 'hireDate', 'status'], v)}</div>`,

    $('#eNext').innerHTML = cur === 3 ? `${ic('save')} حفظ الموظف` : `التالي ${ic('chevL')}`; $('#eBack').hidden = !cur; prev();
  };

  $('#ef').oninput = () => { cap(); prev(); }; $('#ef').onchange = () => { cap(); prev(); };
  $('#eNext').onclick = (e) => { e.preventDefault(); cap(); if (cur === 0 && !v.name) return fieldError($('#ef'), 'name', 'الاسم مطلوب'); if (cur < 3) { cur++; draw(); } else save(e.currentTarget); };
  $('#eBack').onclick = (e) => { e.preventDefault(); cap(); cur--; draw(); };

  draw();

  const J = list('jobs').filter((j) => inRange(j.createdAt, from, to) && (!branchId || j.branchId === +branchId) && (!mode || j.mode === mode));

    }
    if (tab === 'roles') B.innerHTML = panel(`مصفوفة صلاحيات الدور: ${APP.roles[u.role]}`, matrix(u.role) + `<a class="btn ghost" href="#/settings/roles">${ic('edit')} تعديل مصفوفة الأدوار</a>`, { icon: 'shield' });
    if (tab === 'audit') { const a = await api('GET', `/users/${u.id}/audit`); B.innerHTML = panel('سجل التدقيق للمستخدم', a.items.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>التاريخ والوقت</th><th>الإجراء</th><th>الوحدة</th><th>التفاصيل</th></tr></thead><tbody>${a.items.map((x) => `<tr><td>${dtFmt(x.at)}</td><td>${esc({ create: 'إضافة', update: 'تعديل', delete: 'حذف', status: 'تغيير حالة', state: 'تغيير حالة', upload: 'رفع ملف', password: 'كلمة المرور', convert: 'تحويل' }[x.action] || x.action)}</td><td>${esc((SC.E[x.entity] || {}).label || x.entity)}</td><td>${esc(x.label)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لا توجد عمليات مسجلة لهذا المستخدم.</p>', { icon: 'clock' })
      + panel('سجل الدخول', (a.logins || []).length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الوقت</th><th>النتيجة</th><th>عنوان IP</th></tr></thead><tbody>${a.logins.map((l) => `<tr><td>${dtFmt(l.at)}</td><td>${l.ok ? badge('ناجح', 'green') : badge({ 'bad-password': 'كلمة مرور خاطئة', 'bad-2fa': 'رمز تحقق خاطئ', locked: 'مقفل مؤقتاً', disabled: 'حساب موقوف' }[l.reason] || 'فشل', 'red')}</td><td class="ltr">${esc(l.ip || '')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">لا يوجد سجل دخول.</p>', { icon: 'key' }); }
  };
  main.onclick = async (e) => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; draw(); return; }
    const eye = e.target.closest('.eye'); if (eye) { const i = eye.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; return; }
    if (e.target.closest('#uUnlock')) { try { await api('PUT', '/users/' + u.id, { unlock: true }); toast('تم فك القفل'); render(); } catch (err) { toast(err.message, 'err'); } return; }
    if (e.target.closest('#uMfa')) { if (!(await confirmBox('سيتم إيقاف التحقق بخطوتين لهذا المستخدم ليتمكن من الدخول بكلمة المرور ثم إعادة تفعيله. استخدم هذا فقط إذا فقد هاتفه.', { ok: 'إعادة الضبط' }))) return; try { await api('PUT', '/users/' + u.id, { resetMfa: true }); toast('تمت إعادة ضبط التحقق بخطوتين'); render(); } catch (err) { toast(err.message, 'err'); } return; }
    if (e.target.closest('#uToggle')) { try { await api('PUT', '/users/' + u.id, { status: u.status === 'active' ? 'disabled' : 'active' }); toast('تم تحديث حالة الحساب'); render(); } catch (err) { toast(err.message, 'err'); } }
  };
  main.onchange = (e) => { if (e.target.name === 'role') { $('#partyF').hidden = e.target.value !== 'client'; $('#rolePrev').innerHTML = matrix(e.target.value); } };
  main.onsubmit = (e) => { e.preventDefault(); const f = e.target; busy($('[type=submit]', f), async () => {
    const d = readForm(f);
    if (!u) { if (!/^[\p{L}\p{N}_.]{3,30}$/u.test(d.username)) { fieldError(f, 'username', 'من 3 إلى 30 حرفاً أو رقماً بدون مسافات'); throw new Error('اسم المستخدم غير صالح'); } if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)) { fieldError(f, 'email', 'أدخل بريداً صحيحاً'); throw new Error('البريد غير صالح'); } if ((d.password || '').length < 8 || !/\d/.test(d.password) || !/[A-Za-z\u0600-\u06FF]/.test(d.password)) { fieldError(f, 'password', '8 أحرف على الأقل، حروف وأرقام معاً'); throw new Error('كلمة المرور ضعيفة'); } }
    if (d.role === 'client' && !d.partyId) { fieldError(f, 'partyId', 'اختر العميل'); throw new Error('اختر العميل المرتبط'); }
    if (u && d.password && d.password.length < 8) { fieldError(f, 'password', '8 أحرف على الأقل'); throw new Error('كلمة المرور قصيرة'); }
    if (u) { await api('PUT', '/users/' + u.id, d); toast('تم حفظ بيانات المستخدم'); } else { await api('POST', '/users', d); toast('تم إنشاء المستخدم، يمكنه الدخول الآن باسم المستخدم وكلمة المرور'); }
    const meta = await api('GET', '/meta'); APP.users = meta.users; go('#/settings'); }).catch(() => {}); };
  draw();
}
route('/settings/users/new', (m) => userPage(m, null), 'settings');
route('/settings/users/:id', (m, p) => userPage(m, +p.id), 'settings');

route('/settings/roles', async (main) => {
  const R = await api('GET', '/roles');
  const roles = JSON.parse(JSON.stringify(R.roles));
  let cur = Object.keys(roles).find((k) => k !== 'admin') || 'admin';
  const draw = () => {
    const pr = roles[cur].perms || {}; const lock = cur === 'admin' || cur === 'client' || !isAdmin();
    main.innerHTML = `${pageHead({ title: 'الأدوار والصلاحيات', sub: 'حدّد ما يستطيع كل دور رؤيته وتنفيذه في كل وحدة', icon: 'lock', crumbs: [['الإعدادات', '#/settings'], ['الأدوار والصلاحيات']], updated: false })}
      <div class="grid g-1-3"><aside class="panel"><div class="panel-h"><h3>${ic('users')}الأدوار</h3></div><ul class="role-list">${Object.entries(roles).map(([k, r]) => `<li><button class="${k === cur ? 'on' : ''}" data-role="${k}">${esc(r.label)}</button></li>`).join('')}</ul>
        ${isAdmin() ? `<div class="panel-b"><button class="btn ghost block sm" id="newRole">${ic('plus')} دور جديد</button></div>` : ''}</aside>
        <div class="panel"><div class="panel-h"><h3>${ic('shield')}مصفوفة صلاحيات: ${esc(roles[cur].label)}</h3>${lock ? badge(cur === 'admin' ? 'كل الصلاحيات دائماً' : cur === 'client' ? 'بوابة العميل فقط' : 'للعرض فقط', 'navy') : ''}</div>
          <div class="panel-b">${cur !== 'admin' && cur !== 'client' && isAdmin() ? `<div class="field narrow"><label>اسم الدور</label><input id="roleLabel" value="${esc(roles[cur].label)}"></div>` : ''}
          <div class="tbl-wrap"><table class="tbl matrix"><thead><tr><th>الوحدة</th><th>قراءة</th><th>إضافة</th><th>تعديل</th><th>حذف</th></tr></thead><tbody>${R.modules.map(([k, l, i]) => `<tr><td><div class="cell-ic">${ic(i)}<span>${esc(l)}</span></div></td>${'rcud'.split('').map((a) => `<td class="center"><input type="checkbox" class="big-chk" data-m="${k}" data-a="${a}" ${cur === 'admin' || String(pr[k] || '').includes(a) ? 'checked' : ''} ${lock ? 'disabled' : ''} aria-label="${esc(l)} ${a}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
          ${!lock ? `<div class="form-actions"><button class="btn primary" id="saveRoles">${ic('save')} حفظ الصلاحيات</button></div>` : ''}</div></div>`;
  };
  main.onclick = async (e) => {
    const r = e.target.closest('[data-role]'); if (r) { cur = r.dataset.role; draw(); return; }
    if (e.target.closest('#newRole')) { const label = prompt('اسم الدور الجديد (مثال: مشرف مستودعات)'); if (!label) return; const key = 'role_' + (Object.keys(roles).length + 1) + Date.now().toString(36).slice(-3); roles[key.replace(/[^a-z_]/g, 'x').slice(0, 20)] = { label, perms: {} }; cur = Object.keys(roles).pop(); draw(); }
    if (e.target.closest('#saveRoles')) busy(e.target.closest('button'), async () => { const rl = $('#roleLabel'); if (rl) roles[cur].label = rl.value.trim() || roles[cur].label; await api('PUT', '/roles', { roles }); const meta = await api('GET', '/meta'); APP.roles = meta.roles; toast('تم حفظ الصلاحيات'); }).catch(() => {});
  };
  main.onchange = (e) => { const c = e.target.closest('[data-m]'); if (!c) return; const p = roles[cur].perms || (roles[cur].perms = {}); let s = String(p[c.dataset.m] || ''); s = c.checked ? s + c.dataset.a : s.replace(c.dataset.a, '');
    if (c.dataset.a !== 'r' && c.checked && !s.includes('r')) s += 'r'; if (c.dataset.a === 'r' && !c.checked) s = ''; p[c.dataset.m] = [...new Set(s.split(''))].join(''); draw(); };
  draw();
}, 'settings');

route('/settings/system', async (main, p, q) => {
  if (!isAdmin()) throw new Error('هذه الصفحة لمدير النظام فقط');
  const s = JSON.parse(JSON.stringify(APP.settings)); let sec = q.s || 'company';
  const draw = () => {
    main.innerHTML = `${pageHead({ title: 'إعدادات النظام', icon: 'gear', crumbs: [['الإعدادات', '#/settings'], ['إعدادات النظام']], updated: false })}
      <div class="tabs-bar">${[['company', 'بيانات الشركة'], ['currency', 'العملات وأسعار الصرف'], ['invoice', 'الفواتير والدفع'], ['security', 'الأمان'], ['backup', 'التنبيهات والنسخ الاحتياطي']].map(([k, l]) => `<button class="tb ${sec === k ? 'on' : ''}" data-sec="${k}">${l}</button>`).join('')}</div>
      <form class="panel form-page" id="sf"><div class="panel-b">${
        sec === 'company' ? `<div class="form-grid cols-2">${[['nameAr', 'اسم الشركة بالعربي'], ['name', 'اسم الشركة بالإنجليزي'], ['address', 'العنوان'], ['phone', 'الهاتف'], ['email', 'البريد الإلكتروني'], ['taxNo', 'الرقم الضريبي'], ['website', 'الموقع الإلكتروني']].map(([k, l]) => `<div class="field"><label>${l}</label><input data-c="${k}" value="${esc(s.company[k] || '')}" ${['phone', 'email', 'taxNo', 'website'].includes(k) ? 'dir="ltr"' : ''}></div>`).join('')}</div><p class="muted">تظهر هذه البيانات في ترويسة الفواتير وعروض الأسعار وبوالص الشحن المطبوعة.</p>`
        : sec === 'currency' ? `<p class="muted">العملة الأساسية للتقارير: <b>${esc(s.base)}</b>. أدخل سعر كل عملة مقابل 1 ${esc(s.base)}.</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>العملة</th><th>سعر الصرف مقابل ${esc(s.base)}</th></tr></thead><tbody>${s.currencies.map(([c, r], i) => `<tr><td><b>${esc(c)}</b> <small class="muted">${esc(optLabel('invoices', 'currency', c))}</small></td><td><input type="number" step="any" class="ltr num mini-in" data-rate="${i}" value="${r}" ${c === s.base ? 'disabled' : ''}></td></tr>`).join('')}</tbody></table></div>`
        : sec === 'invoice' ? `<div class="form-grid cols-2"><div class="field"><label>نسبة الضريبة الافتراضية %</label><input data-i="taxRate" type="number" step="any" class="ltr" value="${s.invoice.taxRate}"></div><div class="field"><label>مدة الاستحقاق (يوم)</label><input data-i="dueDays" type="number" class="ltr" value="${s.invoice.dueDays}"></div>
            <div class="field"><label>اسم البنك</label><input data-i="bankName" value="${esc(s.invoice.bankName || '')}"></div><div class="field"><label>IBAN</label><input data-i="iban" dir="ltr" value="${esc(s.invoice.iban || '')}"></div><div class="field"><label>رقم الحساب</label><input data-i="account" dir="ltr" value="${esc(s.invoice.account || '')}"></div>
            <div class="field full"><label>شروط الدفع الافتراضية</label><textarea data-i="terms" rows="3">${esc(s.invoice.terms || '')}</textarea></div></div>`
        : sec === 'security' ? `<h3 class="st-t">${ic('shield')} فرض التحقق بخطوتين</h3><p class="muted">اختر الأدوار التي يجب على أصحابها تفعيل التحقق بخطوتين. من لم يفعّله يُطلب منه ذلك عند دخوله قبل استخدام النظام. ننصح بتفعيله على الأقل لمدير النظام والمدير العام والمحاسبة.</p>
            <div class="chk-grid">${Object.entries(APP.roles).filter(([k]) => k !== 'client').map(([k, l]) => `<label class="chk"><input type="checkbox" data-r2="${k}" ${(s.security || { require2fa: [] }).require2fa.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>
            <h3 class="st-t">${ic('lock')} سياسات مطبّقة تلقائياً</h3><ul class="policy">
              <li>${ic('check')} كلمة المرور 8 أحرف على الأقل وتحتوي حروفاً وأرقاماً، ولا تحتوي اسم المستخدم.</li>
              <li>${ic('check')} قفل الحساب 15 دقيقة بعد 5 محاولات دخول خاطئة متتالية.</li>
              <li>${ic('check')} تنتهي الجلسة بعد 14 يوماً من عدم النشاط، و30 يوماً كحد أقصى.</li>
              <li>${ic('check')} تغيير كلمة المرور أو تعطيل الحساب يُخرج المستخدم من كل الأجهزة فوراً.</li>
              <li>${ic('check')} تسجيل كل محاولات الدخول الناجحة والفاشلة مع عنوان IP.</li></ul>`
        : `<div class="toggles">${[['contracts', 'تنبيهات العقود'], ['ops', 'تنبيهات العمليات والشحنات'], ['customers', 'تنبيهات العملاء'], ['finance', 'تنبيهات الفواتير'], ['system', 'تنبيهات النظام والأسطول']].map(([k, l]) => `<label class="tg"><div><b>${l}</b></div><span class="switch"><input type="checkbox" data-n="${k}" ${s.notify[k] ? 'checked' : ''}><span></span></span></label>`).join('')}</div>
            <h3 class="st-t">${ic('download')} النسخ الاحتياطي</h3><p class="muted">على السيرفر النظامي تُؤخذ نسخة احتياطية مشفّرة من قاعدة البيانات والملفات تلقائياً كل يوم، ويمكن إرسالها لمكان خارجي. يمكنك أيضاً تنزيل نسخة كاملة من بيانات الشركة الآن.</p><a class="btn ghost" href="api/erp/backup" download>${ic('download')} تنزيل نسخة احتياطية الآن</a>`}
      </div><div class="form-actions"><button class="btn primary" type="submit">${ic('save')} حفظ الإعدادات</button></div></form>`;
  };
  const cap = () => { $$('[data-c]', main).forEach((i) => { s.company[i.dataset.c] = i.value; }); $$('[data-rate]', main).forEach((i) => { s.currencies[+i.dataset.rate][1] = +i.value || s.currencies[+i.dataset.rate][1]; }); $$('[data-i]', main).forEach((i) => { s.invoice[i.dataset.i] = i.type === 'number' ? +i.value : i.value; }); $$('[data-n]', main).forEach((i) => { s.notify[i.dataset.n] = i.checked; });
    if ($('[data-r2]', main)) s.security = { require2fa: $$('[data-r2]', main).filter((i) => i.checked).map((i) => i.dataset.r2) }; };
  main.onclick = (e) => { const t = e.target.closest('[data-sec]'); if (t) { cap(); sec = t.dataset.sec; draw(); } };
  main.onsubmit = (e) => { e.preventDefault(); cap(); busy($('[type=submit]', e.target), async () => { await api('PUT', '/settings', { company: s.company, currencies: s.currencies, invoice: s.invoice, notify: s.notify, security: s.security || { require2fa: [] } }); APP.settings = s; toast('تم حفظ الإعدادات'); }).catch(() => {}); };
  draw();
}, 'settings');

</script>
